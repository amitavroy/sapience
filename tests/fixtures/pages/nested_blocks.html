<!doctype html>
<html>
<head><title>Nested</title></head>
<body>
  Text before the first heading.
  <h1>Top</h1>
  <ul>
    <li><p>Paragraph inside item</p></li>
    <li>Plain item</li>
  </ul>
  <blockquote><p>Quoted paragraph</p> and trailing quote text</blockquote>
  <div>Loose text <p>Paragraph beside it</p> more loose text</div>
  <h3>Skipped level</h3>
  <p>Under h3.</p>
  <h2>Back up</h2>
  <p>Under h2.</p>
  <h1>Second top</h1>
  <p>Fresh start.</p>
</body>
</html>
